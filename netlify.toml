# Netlify build configuration.
#
# This file exists because the repository root used to hold a pre-built
# index.html that Netlify served directly. It now holds a Vite entry point that
# references /src/main.tsx, which only resolves after a build — so serving the
# root unbuilt would produce a blank page. Netlify must build.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin the toolchain. Netlify's default Node moves over time and a silent
  # major bump is not something a pro-bono site should discover in production.
  NODE_VERSION = "22"

# Client-side routing: every unmatched path serves the app shell so deep links
# such as /fixtures resolve on a hard refresh or a shared link. Netlify matches
# real files first, so this never shadows an asset.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints asset filenames, so they can be cached indefinitely.
# The audience is on Namibian mobile data; repeat visits should cost nothing.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The shell is not fingerprinted and must always revalidate, or a deploy will
# not reach anyone still holding a cached copy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
